name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#3b7bff&color_dots=#f4f4f5,#dbe7ff,#9ec1ff,#3b7bff,#1d4ed8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#9ec1ff&color_dots=#18181b,#172554,#1d4ed8,#3b7bff,#9ec1ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
